[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devopsflow"
version = "1.0.0"
description = "Enterprise Local DevOps Control Center & Lifecycle Platform"
authors = [{ name = "DevOpsFlow Team" }]
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

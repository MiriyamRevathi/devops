{% extends "base.html" %}
{% block title %}Edit {{ project.name }} — DevOpsFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Project: {{ project.name }}</h1>
</div>

<div class="card card-form">
    <div class="card-body">
        <form method="POST" action="{{ url_for('projects.edit', project_id=project.id) }}">
            <div class="form-group">
                <label for="name">Project Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ project.name }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ project.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="team">Assigned Team</label>
                <input type="text" id="team" name="team" class="form-control" value="{{ project.team }}">
            </div>
            <div class="form-row">
                <div class="form-group col-6">
                    <label for="default_branch">Default Branch</label>
                    <input type="text" id="default_branch" name="default_branch" class="form-control" value="{{ project.default_branch }}">
                </div>
                <div class="form-group col-6">
                    <label for="environment">Target Environment</label>
                    <select id="environment" name="environment" class="form-control">
                        <option value="Development" {% if project.environment == 'Development' %}selected{% endif %}>Development</option>
                        <option value="Testing" {% if project.environment == 'Testing' %}selected{% endif %}>Testing</option>
                        <option value="Staging" {% if project.environment == 'Staging' %}selected{% endif %}>Staging</option>
                        <option value="Production" {% if project.environment == 'Production' %}selected{% endif %}>Production</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Create Team — DevOpsFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Create Engineering Team</h1>
</div>

<div class="card card-form">
    <div class="card-body">
        <form method="POST" action="{{ url_for('teams.create') }}">
            <div class="form-group">
                <label for="name">Team Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Site Reliability Engineering">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="lead">Team Lead Username</label>
                <input type="text" id="lead" name="lead" class="form-control" value="admin">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Team</button>
                <a href="{{ url_for('teams.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

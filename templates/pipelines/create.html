{% extends "base.html" %}
{% block title %}Create Pipeline — DevOpsFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Create Interactive CI Pipeline</h1>
</div>

<div class="card card-form">
    <div class="card-body">
        <form method="POST" action="{{ url_for('pipelines.create') }}">
            <div class="form-group">
                <label for="name">Pipeline Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Master Release Build">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Select Pipeline Stages (Executed Sequentially)</label>
                <div class="stage-checkboxes">
                    {% for stage in available_stages %}
                    <label class="checkbox-label" style="display:block; margin-bottom: 6px;">
                        <input type="checkbox" name="stages" value="{{ stage }}" checked> {{ stage }}
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Pipeline</button>
                <a href="{{ url_for('pipelines.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Deploy Release — DevOpsFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Trigger Target Deployment</h1>
</div>

<div class="card card-form">
    <div class="card-body">
        <form method="POST" action="{{ url_for('deployments.deploy') }}">
            <div class="form-group">
                <label for="version">Release Version</label>
                <input type="text" id="version" name="version" class="form-control" value="v1.0.0" required>
            </div>
            <div class="form-group">
                <label for="environment">Target Environment</label>
                <select id="environment" name="environment" class="form-control">
                    <option value="Development">Development</option>
                    <option value="Testing">Testing</option>
                    <option value="Staging">Staging</option>
                    <option value="Production">Production</option>
                </select>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="require_approval" value="true"> Require Approval Before Executing
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Start Deployment</button>
                <a href="{{ url_for('deployments.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

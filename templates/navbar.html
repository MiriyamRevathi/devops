<header class="navbar">
    <div class="navbar-left">
        <span class="navbar-title">DevOps Control Center</span>
    </div>
    <div class="navbar-right">
        {% if session.get('user_id') %}
        <div class="user-menu">
            <span class="user-info">
                <strong>{{ current_user.full_name }}</strong> ({{ current_user.username }})
            </span>
            <span class="badge badge-role">{{ current_user.role }}</span>
            <a href="{{ url_for('auth.profile') }}" class="btn btn-sm btn-secondary">Profile</a>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-danger">Sign Out</a>
        </div>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-sm btn-primary">Sign In</a>
        {% endif %}
    </div>
</header>

<header class="top-navbar">
    <div class="navbar-left">
        <div class="breadcrumb">
            <span class="breadcrumb-item">DevOpsFlow</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Control Center</span>
        </div>
    </div>
    <div class="navbar-right">
        <form action="{{ url_for('auth.switch_role') }}" method="POST" class="role-switcher-form">
            <label for="role-select">Role Demo Switch:</label>
            <select name="role" id="role-select" onchange="this.form.submit()">
                <option value="Admin" {% if session.get('role') == 'Admin' %}selected{% endif %}>Admin</option>
                <option value="DevOps Engineer" {% if session.get('role') == 'DevOps Engineer' %}selected{% endif %}>DevOps Engineer</option>
                <option value="Developer" {% if session.get('role') == 'Developer' %}selected{% endif %}>Developer</option>
                <option value="QA Engineer" {% if session.get('role') == 'QA Engineer' %}selected{% endif %}>QA Engineer</option>
                <option value="Viewer" {% if session.get('role') == 'Viewer' %}selected{% endif %}>Viewer</option>
            </select>
        </form>

        <div class="user-profile-menu">
            <span class="user-avatar">👤</span>
            <span class="user-name">{{ current_user.username }}</span>
            <span class="user-badge">{{ current_user.role }}</span>
            <a href="{{ url_for('auth.profile') }}" class="btn-sm">Profile</a>
            <a href="{{ url_for('auth.logout') }}" class="btn-sm btn-outline">Logout</a>
        </div>
    </div>
</header>

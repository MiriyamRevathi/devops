{% extends "base.html" %}
{% block title %}Create Alert Rule — DevOpsFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Create Alert Rule</h1>
</div>

<div class="card card-form">
    <div class="card-body">
        <form method="POST" action="{{ url_for('alerts.create') }}">
            <div class="form-group">
                <label for="name">Rule Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Memory Usage Alert > 85%">
            </div>
            <div class="form-row">
                <div class="form-group col-4">
                    <label for="metric">Metric</label>
                    <select id="metric" name="metric" class="form-control">
                        <option value="CPU">CPU Usage (%)</option>
                        <option value="Memory">Memory Usage (%)</option>
                        <option value="Error Rate">Error Rate (%)</option>
                        <option value="Response Time">Response Time (ms)</option>
                    </select>
                </div>
                <div class="form-group col-4">
                    <label for="condition">Condition</label>
                    <select id="condition" name="condition" class="form-control">
                        <option value=">">&gt; (Greater than)</option>
                        <option value=">=">&gt;= (Greater than or equal)</option>
                        <option value="<">&lt; (Less than)</option>
                    </select>
                </div>
                <div class="form-group col-4">
                    <label for="threshold">Threshold</label>
                    <input type="number" step="0.1" id="threshold" name="threshold" class="form-control" value="80.0" required>
                </div>
            </div>
            <div class="form-group">
                <label for="service">Target Service</label>
                <input type="text" id="service" name="service" class="form-control" value="All">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Alert Rule</button>
                <a href="{{ url_for('alerts.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

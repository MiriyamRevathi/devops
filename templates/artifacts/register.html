{% extends "base.html" %}
{% block title %}Register Artifact — DevOpsFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Register Build Package Artifact</h1>
</div>

<div class="card card-form">
    <div class="card-body">
        <form method="POST" action="{{ url_for('artifacts.register') }}">
            <div class="form-group">
                <label for="name">Package Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. devopsflow-analytics">
            </div>
            <div class="form-group">
                <label for="version">Version Tag</label>
                <input type="text" id="version" name="version" class="form-control" required placeholder="v1.0.0">
            </div>
            <div class="form-row">
                <div class="form-group col-6">
                    <label for="artifact_type">Artifact Type</label>
                    <select id="artifact_type" name="artifact_type" class="form-control">
                        <option value="wheel">wheel (.whl)</option>
                        <option value="tar">tar.gz archive</option>
                        <option value="zip">zip archive</option>
                        <option value="container_image">container_image</option>
                    </select>
                </div>
                <div class="form-group col-6">
                    <label for="size_bytes">Package Size (Bytes)</label>
                    <input type="number" id="size_bytes" name="size_bytes" class="form-control" value="2048576">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Register Package</button>
                <a href="{{ url_for('artifacts.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
